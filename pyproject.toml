[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-code-14b-instruct"
version = "0.1.0"
description = "Optimized Lightweight LLM Architecture & Serving Stack for 36GB RAM Machines"
readme = "README.md"
authors = [
    { name = "Nilesh Chakraborty", email = "nileshchakraborty@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0; sys_platform != 'darwin'",
    "mlx-lm>=0.19.0; sys_platform == 'darwin'",
    "huggingface-hub>=0.25.0",
    "psutil>=5.9.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0"
]

[project.optional-dependencies]
unsloth = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git; sys_platform != 'darwin'"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0"
]

[project.scripts]
apex-serve = "scripts.run_speculative_server:main"
apex-bench = "scripts.benchmark_throughput:main"
